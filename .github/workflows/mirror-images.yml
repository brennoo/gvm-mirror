name: Mirror images

# GitHub disables `schedule:` triggers after 60 days of no repository
# activity — a quiet period silently stops this job and nothing notifies
# anyone. workflow_dispatch is here so the mirror can always be refreshed by
# hand regardless of whether the schedule is currently alive.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write

# This job holds elevated permissions, unlike this repo's other workflows —
# every action reference here is pinned to a commit SHA so they can't be
# exercised by a moved tag.

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror images
        run: ./mirror-images.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: image-mirror-lock
          path: image-mirror.lock.json

      - name: Detect lock file drift
        id: drift
        run: |
          if git diff --quiet -- image-mirror.lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo '## Lock file drift'
              echo '```diff'
              git diff -- image-mirror.lock.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # A PAT creates the PR (GITHUB_TOKEN would suppress CI and can't
      # approve its own PR below). Main only changes via the merge below,
      # after CI passes on the PR.
      - name: Open PR with lock file update
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.MIRROR_PR_TOKEN }}
          BRANCH: mirror/lock-update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add image-mirror.lock.json
          git commit -m "Sync lock file from the $(date -u +%F) mirror run"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" \
            "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --head "$BRANCH" \
              --title "Sync lock file from the $(date -u +%F) mirror run" \
              --body "Automated lock file update from the scheduled mirror run. See the run's job summary for the diff."
          fi

      # Re-approve every run: the force-push above dismisses stale reviews.
      - name: Approve PR
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review "mirror/lock-update" --approve --body "Auto-approved lock file sync from the scheduled mirror run."

      # Merge with the PAT so GITHUB_TOKEN keeps contents: read and the
      # merge push still triggers CI on main. A failed check leaves the PR
      # open for a human instead.
      - name: Merge PR
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.MIRROR_PR_TOKEN }}
        run: |
          sleep 15
          gh pr checks "mirror/lock-update" --watch --fail-fast
          gh pr merge "mirror/lock-update" --squash
