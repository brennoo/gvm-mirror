name: Mirror images

# GitHub disables `schedule:` triggers after 60 days of no repository
# activity — a quiet period silently stops this job and nothing notifies
# anyone. workflow_dispatch is here so the mirror can always be refreshed by
# hand regardless of whether the schedule is currently alive.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# This job holds packages: write, unlike this repo's other workflows — every
# action reference here is pinned to a commit SHA (not just third-party
# ones) so that elevated permission can't be exercised by a moved tag.

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror images
        run: ./mirror-images.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: image-mirror-lock
          path: image-mirror.lock.json

      # Purely informational: this job never commits. A human reviews the
      # diff above and opens a PR if the lock changed.
      - name: Report lock file drift
        if: always()
        run: |
          {
            echo '## Lock file drift'
            echo '```diff'
            git diff -- image-mirror.lock.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
